<g><rect x="345" y="30" width="270" height="70" rx="10" fill="#edf3ff" stroke="#9aa8b9"/><text x="480" y="61" text-anchor="middle" class="heading">dbt Docs</text><text x="480" y="83" text-anchor="middle" class="detail">Declared model lineage</text></g>
<g><rect x="20" y="170" width="250" height="86" rx="10" fill="#edf3ff" stroke="#9aa8b9"/><text x="145" y="209" text-anchor="middle" class="heading">Local Dagster</text><text x="145" y="231" text-anchor="middle" class="detail">Click Materialize to select assets</text></g>
<g><rect x="315" y="170" width="250" height="86" rx="10" fill="#fff3df" stroke="#9aa8b9"/><text x="440" y="209" text-anchor="middle" class="heading">dbt Core</text><text x="440" y="231" text-anchor="middle" class="detail">Compiles models and test queries</text></g>
<g><rect x="610" y="170" width="250" height="86" rx="10" fill="#ffebe8" stroke="#9aa8b9"/><text x="735" y="209" text-anchor="middle" class="heading">Databricks SQL warehouse</text><text x="735" y="231" text-anchor="middle" class="detail">Executes the compiled SQL</text></g>
<g><rect x="905" y="170" width="250" height="86" rx="10" fill="#e4f5ed" stroke="#9aa8b9"/><text x="1030" y="209" text-anchor="middle" class="heading">Unity Catalog</text><text x="1030" y="231" text-anchor="middle" class="detail">Stores tables and views</text></g>
