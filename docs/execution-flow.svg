<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1175 554" role="img" aria-labelledby="title desc">
<title id="title">How Dagster, dbt and Databricks work together</title>
<desc id="desc">Dagster loads dependencies from the dbt manifest and starts a dbt build. dbt compiles SQL and tests for the Databricks SQL warehouse. Unity Catalog stores the resulting tables and views, surfaces runtime lineage in Catalog Explorer and provides inputs for Lakeflow Designer. Query results flow back through dbt into local Dagster run history.</desc>
<defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#334155"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6941a5"/></marker></defs>
<style>
  .heading {font: 700 19px system-ui, sans-serif; fill: #172338}
  .detail {font: 500 15px system-ui, sans-serif; fill: #34435b}
  .label {font: 600 15px system-ui, sans-serif; fill: #334155}
  .arrow,.return {fill:none; stroke:#334155; stroke-width:2; marker-end:url(#tip)}
  .return {stroke:#6941a5; stroke-dasharray:6 4; marker-end:url(#back)}
</style>
<rect width="1175" height="554" rx="16" fill="#ffffff"/>
<path d="M270 65 H345" class="arrow"/>
<path d="M145 100 V170" class="arrow"/>
<path d="M270 213 H315" class="arrow"/>
<path d="M565 213 H610" class="arrow"/>
<path d="M860 213 H905" class="arrow"/>
<path d="M735 256 V297 H440 V338" class="return"/>
<path d="M315 379 H270" class="return"/>
<path d="M1030 256 V310 H735 V338" class="arrow"/>
<path d="M1030 256 V338" class="arrow"/>
<path d="M1030 420 V470" class="arrow"/>
<text x="157" y="135" class="label">Loads dependencies</text>
<text x="293" y="193" text-anchor="middle" class="label">Build</text>
<text x="587" y="193" text-anchor="middle" class="label">SQL</text>
<text x="882" y="193" text-anchor="middle" class="label">Write</text>
<text x="580" y="286" text-anchor="middle" class="label">Query results return to dbt</text>
