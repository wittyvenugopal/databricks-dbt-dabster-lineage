<g><rect x="905" y="338" width="250" height="82" rx="10" fill="#e4f5ed" stroke="#9aa8b9"/><text x="1030" y="375" text-anchor="middle" class="heading">Lakeflow Designer</text><text x="1030" y="397" text-anchor="middle" class="detail">Reads dbt tables as sources</text></g>
